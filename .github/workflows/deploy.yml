name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - prod
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'my-portfolio-app/package-lock.json'

      - name: Install dependencies
        run: cd my-portfolio-app && npm install

      - name: Build Angular app
        run: cd my-portfolio-app && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-portfolio-app/docs
