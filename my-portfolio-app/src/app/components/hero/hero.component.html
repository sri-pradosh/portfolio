<section id="home" class="hero">
    <div class="container">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title fade-in-up">
                    Hi, I'm <span class="text-primary typing">{{ displayedName }}</span>
                </h1>
                <h2 class="hero-subtitle fade-in-up">Software Developer</h2>
                <p class="hero-description fade-in-up">
                    Bringing ideas to life with code | Transforming user experiences...
                </p>
                <div class="hero-buttons fade-in-up">
                    <a href="#portfolio" class="btn btn-primary">View My Work</a>
                    <a href="#contact" class="btn btn-outline">Get In Touch</a>
                </div>
            </div>
            <div class="hero-image fade-in">
                <div class="image-placeholder">
                    <img src="assets/img.png" alt="Professional headshot" class="profile-image">
                </div>
            </div>
        </div>
    </div>
    <div class="hero-bg-elements">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>
</section>
